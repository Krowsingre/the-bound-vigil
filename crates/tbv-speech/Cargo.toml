[package]
name = "tbv-speech"
version = "0.68.0"
edition.workspace = true
license.workspace = true
description = "Speech recognition on the device (whisper.cpp), for lining up read-along"

[dependencies]
tbv-core = { path = "../tbv-core" }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
# On the phone's or the Mac's graphics chip.
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(any(target_os = "ios", target_os = "macos")))'.dependencies]
whisper-rs = "0.16"

[dev-dependencies]
serde_json.workspace = true
