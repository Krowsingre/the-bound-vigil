[package]
name = "tbv-speech"
version = "1.40.0"
edition.workspace = true
license.workspace = true
description = "Speech recognition on the device (whisper.cpp), for lining up read-along"

[dependencies]
tbv-core = { path = "../tbv-core" }

[target.'cfg(target_os = "ios")'.dependencies]
# On the phone's graphics chip.
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
whisper-rs = "0.16"

[dev-dependencies]
serde_json.workspace = true
