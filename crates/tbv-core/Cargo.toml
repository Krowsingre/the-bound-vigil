[package]
name = "tbv-core"
version = "1.58.0"
edition.workspace = true
license.workspace = true
description = "UI-independent library, identity and storage core for The Bound Vigil"

[dependencies]
cfb = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
encoding_rs = "0.8"
hex = "0.4"
id3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
lofty = "0.22"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls", "ring", "webpki-roots"] }
lopdf = { version = "0.45", default-features = false }
mp4ameta = "0.13"
quick-xml = "0.37"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
rusqlite = { version = "0.37", features = ["bundled", "functions", "backup"] }
serde.workspace = true
serde_json.workspace = true
md-5 = "0.10"
sha2 = "0.10"
suppaftp = { version = "12", features = ["rustls-ring"] }
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "time", "io-util", "net"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4", "v7"] }
webpki-roots = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
unrar = "0.5.8"
unicode-normalization = "0.1"
url = "2"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[dev-dependencies]
libunftp = { version = "0.23", default-features = false, features = ["ring"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
unftp-sbe-fs = "0.4"
