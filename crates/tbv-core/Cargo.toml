[package]
name = "tbv-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "UI-independent library, identity and storage core for The Bound Vigil"

[dependencies]
cfb = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
encoding_rs = "0.8"
hex = "0.4"
id3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
lofty = "0.22"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls", "ring", "webpki-roots"] }
lopdf = { version = "0.45", default-features = false }
mp4ameta = "0.13"
quick-xml = "0.37"
rusqlite = { version = "0.37", features = ["bundled", "functions", "backup"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4", "v7"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
