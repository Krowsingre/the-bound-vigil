[package]
name = "the-bound-vigil"
version = "1.39.0"
edition.workspace = true
license.workspace = true

[lib]
name = "tbv_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tbv-core = { path = "../crates/tbv-core" }
tbv-speech = { path = "../crates/tbv-speech" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
uuid = { version = "1", features = ["v4"] }
# Downloading the speech model for lining up read-along.
ureq = "3"

[dev-dependencies]
tempfile = "3"

# Windows' web view, for the browser's protection levels, saved logins and cancelling downloads.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# The Microsoft Store, for buying the unlock.
windows = { version = "0.62", features = ["std", "ApplicationModel", "Services_Store", "Foundation", "Foundation_Collections", "ApplicationModel_DataTransfer", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-collections = "0.3"

# Updating itself, on computers (phones update from their app store).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-updater = "2"
# Noticing at once when a cloud app changes the synced folder.
notify = { version = "8", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-tbv-ios = { path = "../crates/tauri-plugin-tbv-ios" }
