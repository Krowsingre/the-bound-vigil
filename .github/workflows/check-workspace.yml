name: Verify installed split and preview
on:
  push:
    branches: [codex/check-workspace-split]
permissions:
  actions: read
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm install --prefix qa-workspace --no-save --no-package-lock playwright-core@1.58.2
      - run: |
          npx vite preview --host 127.0.0.1 --port 2452 &
          for i in {1..20}; do curl -fs http://127.0.0.1:2452/ >/dev/null && break; sleep 1; done
          node qa-workspace/preview.cjs
