name: Mac app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: mac
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Apple-chip Macs only (every Mac sold since 2023).
      - name: Build the app
        run: npx tauri build --target aarch64-apple-darwin --bundles app
        env:
          TBV_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - name: Put the App Store Connect key in place
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8
      # Certificates and a profile made for this build alone, taken away at the end.
      - name: Make this build's signing
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/signing"
          ids=$(python3 scripts/mac_ci_signing.py certificates "$work")
          echo "$ids" >> "$GITHUB_ENV"
          eval "$ids"
          python3 scripts/mac_ci_signing.py profile "$MAC_APP_CERTIFICATE_ID" "$work/embedded.provisionprofile" >> "$GITHUB_ENV"
          password=$(openssl rand -hex 16)
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for name in app installer; do
            openssl x509 -inform DER -in "$work/$name.cer" -out "$work/$name.pem"
            /usr/bin/openssl pkcs12 -export -inkey "$work/$name.key.pem" -in "$work/$name.pem" -out "$work/$name.p12" -passout pass:"$password"
            security import "$work/$name.p12" -k "$keychain" -P "$password" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
            rm -f "$work/$name.key.pem" "$work/$name.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      # The sandbox's entitlements and the profile go in, then the installer the Mac App Store takes.
      - name: Sign the app and make its installer
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/signing"
          app="target/aarch64-apple-darwin/release/bundle/macos/The Bound Vigil.app"
          cn() { openssl x509 -in "$work/$1.pem" -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= *//p'; }
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$app/Contents/Info.plist"
          cp "$work/embedded.provisionprofile" "$app/Contents/embedded.provisionprofile"
          sed "s/TEAM_ID/$(echo "$APPLE_TEAM_ID" | tr -d '[:space:]')/g" src-tauri/mac/TBV.entitlements > "$work/TBV.entitlements"
          codesign --force --timestamp=none --entitlements "$work/TBV.entitlements" --sign "$(cn app)" "$app"
          codesign --verify --strict --verbose=2 "$app"
          codesign -d --entitlements :- "$app" | grep -q com.apple.security.app-sandbox
          productbuild --component "$app" /Applications --sign "$(cn installer)" "$GITHUB_WORKSPACE/the-bound-vigil-mac.pkg"
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: the-bound-vigil-mac
          path: the-bound-vigil-mac.pkg
          if-no-files-found: error
      # Only once the Mac has been added to the app in App Store Connect.
      - name: Send to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if ! python3 scripts/mac_ci_signing.py has-mac; then
            echo "::warning::The Mac isn't added to The Bound Vigil in App Store Connect yet, so this build wasn't sent to TestFlight."
            exit 0
          fi
          xcrun altool --upload-app --type macos --file the-bound-vigil-mac.pkg --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
      - name: Take this build's signing away
        if: always()
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          [ -s ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8 ] || exit 0
          python3 scripts/mac_ci_signing.py clean "profile:${MAC_PROFILE_ID:-}" "certificate:${MAC_APP_CERTIFICATE_ID:-}" "certificate:${MAC_INSTALLER_CERTIFICATE_ID:-}"
