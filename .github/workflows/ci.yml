name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Core and screen tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Library core tests
        run: cargo test -p tbv-core
      - name: Library core lint
        run: cargo clippy -p tbv-core --all-targets -- -D warnings
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Screen tests
        run: npm test
      - name: Build the interface
        run: npm run build
      - name: Build the web version
        run: npm run build:web

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app and installers
        run: npx tauri build
        env:
          # Google's desktop sign-in "secret" (not a real one, but kept off GitHub's pages).
          TBV_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      # The setup program on its own, so it's the first thing in the download.
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: the-bound-vigil-windows-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload the MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: the-bound-vigil-windows-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
