name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Core and screen tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Library core tests
        run: cargo test -p tbv-core
      - name: Library core lint
        run: cargo clippy -p tbv-core --all-targets -- -D warnings
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Screen tests
        run: npm test
      - name: Build the interface
        run: npm run build

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app and installers
        run: npx tauri build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: the-bound-vigil-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
