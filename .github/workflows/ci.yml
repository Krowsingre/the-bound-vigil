name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Core and screen tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Library core tests
        run: cargo test -p tbv-core
      - name: Library core lint
        run: cargo clippy -p tbv-core --all-targets -- -D warnings
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Screen tests
        run: npm test
      - name: Build the interface
        run: npm run build
      - name: Build the web version
        run: npm run build:web

  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app and installers
        shell: pwsh
        run: |
          # With the update signing key, the installer is signed for TBV's own updater too.
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { npx tauri build --config src-tauri/tauri.updater.conf.json } else { npx tauri build }
        env:
          # Google's desktop sign-in "secret" (not a real one, but kept off GitHub's pages).
          TBV_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      # The setup program on its own, so it's the first thing in the download.
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: the-bound-vigil-windows-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload the MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: the-bound-vigil-windows-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
      # Puts each new version where TBV's updater looks: a GitHub release with
      # the installer, its signature, and latest.json. Off until the
      # repository variable PUBLISH_UPDATES is set to true.
      - name: Publish the update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_UPDATES == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag is already published."; exit 0 }
          $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          $name = "The-Bound-Vigil-$version-setup.exe"
          Copy-Item $exe.FullName $name
          $latest = @{
            version = $version
            notes = "The Bound Vigil $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = "https://github.com/${{ github.repository }}/releases/download/$tag/$name" } }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8NoBOM
          gh release create $tag $name latest.json --title "The Bound Vigil $version" --notes "The Bound Vigil $version" --latest
