name: iPhone app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: iPhone app for TestFlight
    # App Store Connect only takes apps built with Xcode 26 or later.
    runs-on: macos-26
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      # Says which of the four Apple secrets GitHub has (never their values).
      - name: Check the Apple secrets are there
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_API_ISSUER APPLE_API_KEY_ID APPLE_API_KEY_P8 APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "::error::The secret $name is missing or empty."; missing=1; fi
          done
          exit $missing
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      # The Xcode project is made fresh each time from tauri.conf.json and
      # src-tauri/Info.ios.plist, so nothing generated is kept in the repo.
      - name: Make the Xcode project
        run: npx tauri ios init --ci
      - name: Make the app icons
        run: npx tauri icon src-tauri/icons/ios-icon-1024.png
      # TBV's share-sheet add-on (Apple Books and other apps list only apps
      # that have one), and the App Group it hands books over through.
      - name: Add the share-sheet add-on
        run: python3 scripts/integrate_ios_share_extension.py
      - name: Put the App Store Connect key in place
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8
      # One signing certificate for this build, revoked at the end, so builds
      # don't pile up certificates until Apple's limit stops signing.
      - name: Make this build's signing certificate
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Set to true once to revoke the Development certificates earlier builds left behind.
          CLEAR_OLD: "false"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/signing"
          if [ "$CLEAR_OLD" = "true" ]; then python3 scripts/ios_ci_certificate.py clear-old; fi
          id=$(python3 scripts/ios_ci_certificate.py create "$work")
          echo "SIGNING_CERTIFICATE_ID=$id" >> "$GITHUB_ENV"
          password=$(openssl rand -hex 16)
          openssl x509 -inform DER -in "$work/certificate.cer" -out "$work/certificate.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$work/key.pem" -in "$work/certificate.pem" -out "$work/signing.p12" -passout pass:"$password"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$work/signing.p12" -k "$keychain" -P "$password" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$work/key.pem" "$work/signing.p12"
      # Xcode signs the app itself, using the key to fetch the certificate
      # and profile. Each build gets the next number, as TestFlight requires.
      - name: Build the app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY_PATH=~/private_keys/AuthKey_$APPLE_API_KEY.p8
          npx tauri ios build --export-method app-store-connect \
            --config '{"bundle":{"iOS":{"bundleVersion":"${{ github.run_number }}"}}}'
      # Tauri archives without signing, which would leave the add-on out of
      # the App Group. So the app is archived again with Xcode signing each
      # part, reusing the Rust library the build above made.
      - name: Sign the app and its add-on
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple
          archive="$PWD/build/the-bound-vigil_iOS.xcarchive"
          rm -rf "$archive"
          test -s "$PWD/Externals/arm64/release/libapp.a" || { echo "::error::The Rust library wasn't built."; exit 1; }
          # The Rust step can only run inside the Tauri CLI; the library is already built.
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("the-bound-vigil.xcodeproj/project.pbxproj")
          source = p.read_text()
          phase = r"(?m)^(\s*[0-9A-F]{24} /\* Build Rust Code \*/ = \{\n)([\s\S]*?)^(\s*\};)$"
          found = list(re.finditer(phase, source))
          if len(found) != 1 or "tauri ios xcode-script" not in found[0].group(2):
              raise SystemExit(f"Expected one Build Rust Code step, found {len(found)}")
          body, count = re.subn(r'(?m)^(\s*shellScript = )".*";$', r'\1"echo Using the Rust library already built";', found[0].group(2))
          if count != 1:
              raise SystemExit("The Build Rust Code step has an unexpected shape")
          p.write_text(source[:found[0].start(2)] + body + source[found[0].end(2):])
          PY
          # Apple wants the add-on's version and build number to match the app's.
          host=the-bound-vigil_iOS/Info.plist
          ext=TBVShareExtension/Info.plist
          settings=$(xcodebuild -project the-bound-vigil.xcodeproj -target the-bound-vigil_iOS -configuration release -showBuildSettings 2>/dev/null)
          for key in CFBundleShortVersionString CFBundleVersion; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$host")
            if [[ "$value" == *'$('* ]]; then
              name=$(echo "$value" | sed -E 's/.*\$\(([A-Z_]+)\).*/\1/')
              value=$(echo "$settings" | awk -v n="$name" '$1 == n && $2 == "=" { print $3; exit }')
            fi
            test -n "$value"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$ext" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$key string $value" "$ext"
            echo "$key: $value"
          done
          auth=(-allowProvisioningUpdates -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER" -authenticationKeyPath "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8")
          xcodebuild archive -project the-bound-vigil.xcodeproj -scheme the-bound-vigil_iOS -configuration release \
            -destination 'generic/platform=iOS' -archivePath "$archive" "${auth[@]}" \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM" CODE_SIGN_STYLE=Automatic
          cat > /tmp/export-options.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>automatic</string>
          <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          rm -f build/arm64/*.ipa
          xcodebuild -exportArchive -archivePath "$archive" -exportPath "$PWD/build/arm64" -exportOptionsPlist /tmp/export-options.plist "${auth[@]}"
      - name: Check the add-on is in the app and signed
        run: |
          set -euo pipefail
          ipa=$(ls src-tauri/gen/apple/build/arm64/*.ipa | head -1)
          work=$(mktemp -d)
          unzip -q "$ipa" -d "$work"
          app=$(find "$work/Payload" -maxdepth 1 -name '*.app' | head -1)
          ext="$app/PlugIns/TBVShareExtension.appex"
          codesign --verify --strict "$app"
          codesign --verify --strict "$ext"
          for part in "$app" "$ext"; do
            codesign -d --entitlements :- "$part" 2>/dev/null > "$work/ent.plist"
            /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$work/ent.plist" | grep -Fx 'group.com.krowsingre.theboundvigil'
          done
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$ext/Info.plist" | grep -Fx 'com.apple.share-services'
          # Silent pushes need the push entitlement in the signed app.
          codesign -d --entitlements :- "$app" 2>/dev/null > "$work/app-ent.plist"
          /usr/libexec/PlistBuddy -c 'Print :aps-environment' "$work/app-ent.plist" | grep -Fx 'production'
          for key in CFBundleShortVersionString CFBundleVersion; do
            a=$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist"); b=$(/usr/libexec/PlistBuddy -c "Print :$key" "$ext/Info.plist")
            [ "$a" = "$b" ] || { echo "::error::$key is $a in the app but $b in the add-on."; exit 1; }
          done
      - name: Keep the app file
        uses: actions/upload-artifact@v4
        with:
          name: the-bound-vigil-iphone
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error
      - name: Send to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ipa=$(ls src-tauri/gen/apple/build/arm64/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
      - name: Revoke this build's signing certificate
        if: always() && env.SIGNING_CERTIFICATE_ID != ''
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: python3 scripts/ios_ci_certificate.py revoke "$SIGNING_CERTIFICATE_ID"
