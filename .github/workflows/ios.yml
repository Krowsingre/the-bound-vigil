name: iPhone app

on:
  push:
    branches: [main, experiment/ios-share-signing-audit]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: iPhone app for TestFlight
    # App Store Connect only takes apps built with Xcode 26 or later.
    runs-on: macos-26
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      # Says which of the four Apple secrets GitHub has (never their values).
      - name: Check the Apple secrets are there
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_API_ISSUER APPLE_API_KEY_ID APPLE_API_KEY_P8 APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "::error::The secret $name is missing or empty."; missing=1; fi
          done
          exit $missing
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      # The Xcode project is made fresh each time from tauri.conf.json and
      # src-tauri/Info.ios.plist, so nothing generated is kept in the repo.
      - name: Make the Xcode project
        run: npx tauri ios init --ci
      - name: Make the app icons
        run: npx tauri icon src-tauri/icons/ios-icon-1024.png
      - name: Integrate experimental Share Extension target
        if: github.ref == 'refs/heads/experiment/ios-share-signing-audit'
        run: |
          python3 scripts/integrate_ios_share_extension.py
          grep -q 'TBVShareExtension:' src-tauri/gen/apple/project.yml
          test -f src-tauri/gen/apple/TBVShareExtension/ShareExtension.entitlements
      - name: Put the App Store Connect key in place
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8
      # Xcode signs the app itself, using the key to fetch the certificate
      # and profile. Each build gets the next number, as TestFlight requires.
      - name: Build the app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY_PATH=~/private_keys/AuthKey_$APPLE_API_KEY.p8
          npx tauri ios build --export-method app-store-connect \
            --config '{"bundle":{"iOS":{"bundleVersion":"${{ github.run_number }}"}}}'
      # Tauri compiles the archive with signing disabled. Re-archive with Xcode
      # signing enabled so each target's CODE_SIGN_ENTITLEMENTS is applied
      # before distribution export, including the Share Extension.
      - name: Capture generated Xcode project structure
        if: always() && github.ref == 'refs/heads/experiment/ios-share-signing-audit'
        run: |
          set -euo pipefail
          mkdir -p ios-xcode-project
          cp src-tauri/gen/apple/the-bound-vigil.xcodeproj/project.pbxproj ios-xcode-project/project.pbxproj
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("ios-xcode-project/project.pbxproj")
          s = p.read_text()
          lines = s.splitlines()
          matches = [i for i, line in enumerate(lines) if "Build Rust Code" in line or "xcode-script" in line or "shellScript =" in line]
          with Path("ios-xcode-project/build-phase-excerpts.txt").open("w") as out:
              for i in matches:
                  out.write(f"=== line {i+1} ===\\n")
                  out.write("\\n".join(lines[max(0,i-5):min(len(lines),i+7)]) + "\\n")
          print(f"Captured generated Xcode project; {len(matches)} build-phase references")
          PY
      - name: Upload generated Xcode project
        if: always() && github.ref == 'refs/heads/experiment/ios-share-signing-audit'
        uses: actions/upload-artifact@v4
        with:
          name: ios-generated-xcode-project
          path: ios-xcode-project
          if-no-files-found: warn
      - name: Create signed iOS archive and export
        if: github.ref == 'refs/heads/experiment/ios-share-signing-audit'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple
          archive="$PWD/build/the-bound-vigil_iOS.xcarchive"
          rm -rf "$archive"
          # The initial Tauri build has already produced libapp.a. Avoid
          # re-running its Xcode build phase outside the Tauri CLI process,
          # which otherwise requires .tauri/cli-options-server.json.
          # Xcode's release configuration links this exact prebuilt Rust archive.
          test -s "$PWD/Externals/arm64/release/libapp.a" || {
            echo "Missing prebuilt arm64 release Rust library; refusing signed archive" >&2
            exit 1
          }
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("the-bound-vigil.xcodeproj/project.pbxproj")
          source = p.read_text()
          phase_id = "5C7CE252C36A67EB904A636E"
          phase_pattern = (
              r"(?m)^(\s*" + phase_id
              + r" /\* Build Rust Code \*/ = \{\n)"
              + r"([\s\S]*?)"
              + r"^(\s*\};)$"
          )
          matches = list(re.finditer(phase_pattern, source))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one verified Rust build phase, found {len(matches)}")
          match = matches[0]
          body = match.group(2)
          if body.count("shellScript = ") != 1 or "tauri ios xcode-script" not in body:
              raise SystemExit("Rust build phase does not match inspected structure")
          new_body, count = re.subn(
              r'(?m)^(\s*shellScript = )".*";$',
              r'\1"echo Reusing verified prebuilt arm64 release libapp.a";',
              body,
          )
          if count != 1:
              raise SystemExit(f"Expected one shellScript assignment, found {count}")
          modified = source[:match.start(2)] + new_body + source[match.end(2):]
          if modified.count("tauri ios xcode-script") != source.count("tauri ios xcode-script") - 1:
              raise SystemExit("Unexpected modification to Tauri script inventory")
          p.write_text(modified)
          print("Verified: replaced exactly one Rust build script in the inspected Xcode phase")
          PY
          xcodebuild archive \
            -project the-bound-vigil.xcodeproj \
            -scheme the-bound-vigil_iOS \
            -configuration release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8" \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Automatic
          extension="$archive/Products/Applications/The Bound Vigil.app/PlugIns/TBVShareExtension.appex"
          test -d "$extension"
          codesign --verify --strict --verbose=2 "$extension"
          codesign -d --entitlements :- "$extension" > /tmp/tbv-extension-signed-entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' /tmp/tbv-extension-signed-entitlements.plist | grep -Fx 'group.com.krowsingre.theboundvigil'
          cat > /tmp/tbv-export-options.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>automatic</string>
          <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          mkdir -p build/arm64
          xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportPath "$PWD/build/arm64" \
            -exportOptionsPlist /tmp/tbv-export-options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
      - name: Capture extension integration diagnostics
        if: always() && github.ref == 'refs/heads/experiment/ios-share-signing-audit'
        run: |
          mkdir -p ios-extension-diagnostics
          if [ -f src-tauri/gen/apple/project.yml ]; then
            grep -A 22 '  TBVShareExtension:' src-tauri/gen/apple/project.yml > ios-extension-diagnostics/extension-target.txt || true
          fi
          find src-tauri/gen/apple/build -name '*.appex' -print > ios-extension-diagnostics/embedded-extensions.txt 2>/dev/null || true
      - name: Upload extension integration diagnostics
        if: always() && github.ref == 'refs/heads/experiment/ios-share-signing-audit'
        uses: actions/upload-artifact@v4
        with:
          name: ios-extension-diagnostics
          path: ios-extension-diagnostics
          if-no-files-found: warn
      - name: Audit generated iOS signing configuration
        if: github.ref == 'refs/heads/experiment/ios-share-signing-audit'
        run: |
          mkdir -p ios-signing-audit
          cp src-tauri/gen/apple/project.yml ios-signing-audit/project.yml
          find src-tauri/gen/apple -name '*.entitlements' -type f -exec sh -c 'for f do echo "FILE: $f"; plutil -p "$f"; done' sh {} + > ios-signing-audit/entitlements.txt
          archive=$(find src-tauri/gen/apple/build -type d -name '*.xcarchive' -print -quit 2>/dev/null)
          if [ -n "$archive" ]; then
            app="$archive/Products/Applications/The Bound Vigil.app"
            {
              echo "Archive: $archive"
              echo "Embedded extensions:"
              find "$app/PlugIns" -maxdepth 1 -name '*.appex' -print 2>/dev/null || true
              echo "Host signature:"
              codesign -dv "$app" 2>&1 || true
            } > ios-signing-audit/archive.txt
          fi
          echo '=== Archive extension signature and entitlements (unsuppressed) ==='
          archive=$(find src-tauri/gen/apple/build -type d -name '*.xcarchive' -print -quit 2>/dev/null)
          if [ -z "$archive" ]; then
            echo 'Archive not found'
          else
            extension="$archive/Products/Applications/The Bound Vigil.app/PlugIns/TBVShareExtension.appex"
            if [ ! -d "$extension" ]; then
              echo "Archive extension missing: $extension"
            else
              echo "Archive extension: $extension"
              codesign -dv --verbose=4 "$extension" 2>&1 || echo "Archive extension signature inspection failed: $?"
              codesign --verify --strict --verbose=2 "$extension" 2>&1 || echo "Archive extension signature verification failed: $?"
              status=0
              codesign -d --entitlements :- "$extension" > ios-signing-audit/archive-extension-entitlements.plist 2> ios-signing-audit/archive-extension-entitlements.stderr || status=$?
              echo "Archive extension entitlement extraction exit status: $status"
              cat ios-signing-audit/archive-extension-entitlements.stderr
              if [ -s ios-signing-audit/archive-extension-entitlements.plist ]; then
                plutil -p ios-signing-audit/archive-extension-entitlements.plist || cat ios-signing-audit/archive-extension-entitlements.plist
              else
                echo 'Archive extension has no extractable signed entitlements'
              fi
            fi
          fi
          echo '=== Exported extension signature versus archive ==='
          ipa=$(find src-tauri/gen/apple/build/arm64 -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -n "$ipa" ]; then
            audit_tmp=$(mktemp -d)
            unzip -q "$ipa" -d "$audit_tmp"
            exported="$audit_tmp/Payload/The Bound Vigil.app/PlugIns/TBVShareExtension.appex"
            if [ -d "$exported" ]; then
              codesign -dv --verbose=4 "$exported" 2>&1 || echo "Exported extension signature inspection failed: $?"
              status=0
              codesign -d --entitlements :- "$exported" > ios-signing-audit/exported-extension-entitlements.plist 2> ios-signing-audit/exported-extension-entitlements.stderr || status=$?
              echo "Exported extension entitlement extraction exit status: $status"
              cat ios-signing-audit/exported-extension-entitlements.stderr
              if [ -s ios-signing-audit/exported-extension-entitlements.plist ]; then
                plutil -p ios-signing-audit/exported-extension-entitlements.plist || cat ios-signing-audit/exported-extension-entitlements.plist
              fi
            else
              echo 'Exported IPA has no extension'
            fi
            rm -rf "$audit_tmp"
          fi
          echo '=== Extension Xcode build signing settings ==='
          (cd src-tauri/gen/apple && xcodebuild -project the-bound-vigil.xcodeproj -target TBVShareExtension -configuration release -showBuildSettings 2>/dev/null | grep -E '^ *(CODE_SIGN_ENTITLEMENTS|CODE_SIGN_STYLE|PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM) =' || true)
          find src-tauri/gen/apple/build/arm64 -name '*.ipa' -print > ios-signing-audit/ipa.txt 2>/dev/null || true
          echo '=== Generated signing settings (non-secret) ==='
          grep -E '(^|[[:space:]])(CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_ENTITLEMENTS|PROVISIONING_PROFILE_SPECIFIER):' ios-signing-audit/project.yml || true
          echo '=== Archive summary ==='
          cat ios-signing-audit/archive.txt 2>/dev/null || true
          echo '=== Entitlement summary ==='
          cat ios-signing-audit/entitlements.txt 2>/dev/null || true
          echo '=== IPA output ==='
          cat ios-signing-audit/ipa.txt 2>/dev/null || true
      - name: Upload iOS signing audit
        if: always() && github.ref == 'refs/heads/experiment/ios-share-signing-audit'
        uses: actions/upload-artifact@v4
        with:
          name: ios-signing-audit
          path: ios-signing-audit
          if-no-files-found: warn
      - name: Verify exported IPA signature and extension inventory
        if: github.ref == 'refs/heads/experiment/ios-share-signing-audit'
        run: |
          set -euo pipefail
          ipa=$(find src-tauri/gen/apple/build/arm64 -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          unzip -q "$ipa" -d "$work"
          app=$(find "$work/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          echo '=== Exported app signing ==='
          codesign --verify --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Identifier=|TeamIdentifier=|Authority=' || true
          echo '=== Exported app entitlements ==='
          codesign -d --entitlements :- "$app" 2>/dev/null || true
          echo '=== Exported extension inventory ==='
          find "$app/PlugIns" -maxdepth 1 -name '*.appex' -print 2>/dev/null || true
          echo '=== Extension embedded provisioning profile authorization ==='
          extension="$app/PlugIns/TBVShareExtension.appex"
          test -f "$extension/embedded.mobileprovision"
          security cms -D -i "$extension/embedded.mobileprovision" > "$work/extension-profile.plist"
          echo 'Extension profile application identifier:'
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$work/extension-profile.plist"
          echo 'Extension profile App Groups:'
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$work/extension-profile.plist"; then
            echo 'Extension profile includes an App Group entitlement'
          else
            echo '::error::Extension provisioning profile does not authorize an App Group'
            exit 1
          fi
          echo '=== Share Extension signing ==='
          extension="$app/PlugIns/TBVShareExtension.appex"
          test -d "$extension"
          codesign --verify --strict --verbose=2 "$extension"
          codesign -dv "$extension" 2>&1 | grep -E 'Identifier=|TeamIdentifier=|Authority=' || true
          echo '=== Share Extension entitlements ==='
          codesign -d --entitlements :- "$extension" 2>/dev/null | tee "$work/extension-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$work/extension-entitlements.plist" | grep -Fx 'group.com.krowsingre.theboundvigil'
          echo '=== Host App Group entitlement ==='
          codesign -d --entitlements :- "$app" 2>/dev/null > "$work/host-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$work/host-entitlements.plist" | grep -Fx 'group.com.krowsingre.theboundvigil'
          echo '=== Share Extension provisioning profile ==='
          test -f "$extension/embedded.mobileprovision"
          security cms -D -i "$extension/embedded.mobileprovision" > "$work/extension-profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$work/extension-profile.plist" | grep -F '.com.krowsingre.theboundvigil.ShareExtension'
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$work/extension-profile.plist" | grep -Fx 'group.com.krowsingre.theboundvigil'
          echo '=== Embedded provisioning profile ==='
          if [ -f "$app/embedded.mobileprovision" ]; then
            security cms -D -i "$app/embedded.mobileprovision" | plutil -extract Entitlements.application-identifier raw -o - - || true
          else
            echo 'No embedded provisioning profile found'
          fi
      - name: Keep the app file
        uses: actions/upload-artifact@v4
        with:
          name: the-bound-vigil-iphone
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error
      - name: Validate Share Extension metadata for App Store Connect
        if: github.ref == 'refs/heads/experiment/ios-share-signing-audit'
        run: |
          set -euo pipefail
          ipa=$(find src-tauri/gen/apple/build/arm64 -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          unzip -q "$ipa" -d "$work"
          plist="$work/Payload/The Bound Vigil.app/PlugIns/TBVShareExtension.appex/Info.plist"
          test -f "$plist"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$plist" | grep -Fx 'com.apple.share-services'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$plist" | grep -F 'ShareViewController'
      - name: Send to TestFlight
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experiment/ios-share-signing-audit') && github.event_name != 'pull_request'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ipa=$(ls src-tauri/gen/apple/build/arm64/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
