name: Verify Phase 8 macOS redirects
on:
  push:
    branches: [codex/verify-phase-8-mac]
permissions:
  contents: read
concurrency:
  group: phase-8-mac-verification
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo check --locked -p the-bound-vigil
