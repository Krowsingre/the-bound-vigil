name: Verify Update 11
on:
  push:
    branches: [codex/check-update-11]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm install --prefix qa-update11 --no-save --no-package-lock playwright-core@1.58.2
      - run: |
          npx vite --host 127.0.0.1 --port 2452 &
          for i in {1..20}; do curl -fs http://127.0.0.1:2452/ >/dev/null && break; sleep 1; done
          node qa-update11/verify.cjs
